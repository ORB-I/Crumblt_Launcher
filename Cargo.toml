[package]
name = "crumblt-launcher"
version = "1.0.0"
edition = "2021"

[dependencies]
# GUI
egui = "0.27"
eframe = "0.27"

# HTTP Client
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

# File system & paths
dirs = "5.0"
zip = "0.6"

# Registry (Windows)
winreg = "0.52"

# Utilities
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
